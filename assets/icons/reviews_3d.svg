<svg viewBox="0 0 512 512" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft 3D Shadow Filters for Depth and Claymorphism -->
    <filter id="blur-large" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
    <filter id="blur-medium" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
    <filter id="blur-small" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" />
    </filter>

    <!-- Premium Matte Black Materials -->
    <linearGradient id="matteBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2D2D"/>
      <stop offset="40%" stop-color="#151515"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>

    <linearGradient id="matteBlackDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="50%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Edge Highlight for Glossy Bevels -->
    <linearGradient id="edgeHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#555555"/>
      <stop offset="30%" stop-color="#222222"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <!-- Vibrant Yellow Metallic & Clay Materials -->
    <linearGradient id="yellowBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF080"/>
      <stop offset="30%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#A17E00"/>
    </linearGradient>

    <linearGradient id="yellowExt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCA10C"/>
      <stop offset="50%" stop-color="#8A6D00"/>
      <stop offset="100%" stop-color="#4D3D00"/>
    </linearGradient>

    <!-- Ambient Glowing Spheres -->
    <radialGradient id="yellowSphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF080"/>
      <stop offset="40%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#8A6D00"/>
    </radialGradient>

    <!-- Reusable Gear/Ribbed Edge for Quality Seal -->
    <g id="ribbed-edge">
      <rect x="-56" y="-12" width="112" height="24" rx="6" />
      <rect x="-56" y="-12" width="112" height="24" rx="6" transform="rotate(30)" />
      <rect x="-56" y="-12" width="112" height="24" rx="6" transform="rotate(60)" />
      <rect x="-56" y="-12" width="112" height="24" rx="6" transform="rotate(90)" />
      <rect x="-56" y="-12" width="112" height="24" rx="6" transform="rotate(120)" />
      <rect x="-56" y="-12" width="112" height="24" rx="6" transform="rotate(150)" />
      <circle cx="0" cy="0" r="50" />
    </g>
  </defs>

  <!-- ========================================== -->
  <!-- GLOBAL FLOOR SHADOWS                       -->
  <!-- ========================================== -->
  <ellipse cx="256" cy="460" rx="170" ry="26" fill="#000000" opacity="0.35" filter="url(#blur-large)" />
  <ellipse cx="256" cy="460" rx="100" ry="14" fill="#000000" opacity="0.5" filter="url(#blur-medium)" />

  <!-- Background Floating Sparkles & Depth Elements -->
  <g transform="translate(110, 160)">
    <circle cx="0" cy="14" r="16" fill="#000000" opacity="0.4" filter="url(#blur-medium)" />
    <circle cx="0" cy="0" r="16" fill="url(#yellowSphere)" />
    <circle cx="-4" cy="-4" r="6" fill="#FFFFFF" opacity="0.4" filter="url(#blur-small)" />
  </g>

  <!-- MASTER GROUP: Isometric Tilt (-10 degrees) -->
  <g transform="translate(256, 256) rotate(-10) translate(-256, -256)">

    <!-- ========================================== -->
    <!-- 1. HANGING EQUIPMENT TAG (Rental Tie-in)   -->
    <!-- ========================================== -->
    <!-- Positioned behind the main tablet -->
    <g id="equipment-tag" transform="translate(360, 100) rotate(15)">
      <!-- Tag Shadow -->
      <rect x="-30" y="-10" width="60" height="90" rx="12" fill="#000000" opacity="0.5" filter="url(#blur-medium)" transform="translate(0, 8)" />
      <!-- Tag Lanyard Hook -->
      <path d="M 0 -20 C 10 -40, 30 -30, 20 -10" fill="none" stroke="#FACC15" stroke-width="4" stroke-linecap="round" />
      <!-- Tag Body Extrusion -->
      <rect x="-30" y="-10" width="60" height="90" rx="12" fill="#050505" transform="translate(0, 4)" />
      <!-- Tag Front Face -->
      <rect x="-30" y="-10" width="60" height="90" rx="12" fill="url(#matteBlackDark)" />
      <rect x="-29" y="-9" width="58" height="88" rx="11" fill="none" stroke="#333333" stroke-width="2" />

      <!-- Tag Header & Hole -->
      <circle cx="0" cy="8" r="6" fill="#050505" stroke="#222222" stroke-width="1.5" />
      <rect x="-20" y="24" width="40" height="6" rx="3" fill="url(#yellowBadge)" />

      <!-- Barcode Skeletons -->
      <rect x="-20" y="40" width="8" height="30" rx="2" fill="#333333" />
      <rect x="-8" y="40" width="16" height="30" rx="2" fill="#1A1A1A" />
      <rect x="12" y="40" width="8" height="30" rx="2" fill="#333333" />
    </g>

    <!-- ========================================== -->
    <!-- 2. MAIN FEEDBACK TABLET (The Document)     -->
    <!-- ========================================== -->
    <g id="feedback-tablet">
      <!-- Tablet Drop Shadow -->
      <rect x="116" y="110" width="260" height="320" rx="28" fill="#000000" opacity="0.65" filter="url(#blur-large)" transform="translate(0, 20)" />

      <!-- Tablet Extrusion (Thick Volume) -->
      <rect x="116" y="96" width="260" height="320" rx="28" fill="#050505" transform="translate(0, 14)" />
      <rect x="116" y="96" width="260" height="320" rx="28" fill="#0A0A0A" transform="translate(0, 7)" />

      <!-- Tablet Front Face (Matte Black) -->
      <rect x="116" y="96" width="260" height="320" rx="28" fill="url(#matteBlack)" />

      <!-- Glossy Edge Highlight -->
      <rect x="117" y="97" width="258" height="318" rx="27" fill="none" stroke="url(#edgeHighlight)" stroke-width="2" />
      <rect x="136" y="98" width="220" height="2" rx="1" fill="#FFFFFF" opacity="0.1" />

      <!-- ========================================== -->
      <!-- TABLET INTERNAL UI (Review Data)           -->
      <!-- ========================================== -->

      <!-- Reviewer Avatar Base -->
      <circle cx="166" cy="146" r="24" fill="url(#matteBlackDark)" />
      <circle cx="166" cy="146" r="24" fill="none" stroke="#222222" stroke-width="2" />
      <!-- Minimalist User Silhouette -->
      <circle cx="166" cy="140" r="8" fill="#4A4A4A" />
      <path d="M 152 160 C 152 152, 180 152, 180 160" fill="none" stroke="#4A4A4A" stroke-width="6" stroke-linecap="round" />

      <!-- Reviewer Info Lines -->
      <rect x="206" y="130" width="90" height="10" rx="5" fill="#555555" />
      <rect x="206" y="150" width="60" height="8" rx="4" fill="#222222" />

      <!-- Verification Tick next to name -->
      <circle cx="316" cy="135" r="10" fill="url(#yellowBadge)" />
      <path d="M 312 135 L 315 139 L 320 131" fill="none" stroke="#111111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Divider Line -->
      <rect x="142" y="184" width="208" height="2" fill="#1A1A1A" />

      <!-- Written Feedback Text (Skeleton) -->
      <rect x="142" y="206" width="200" height="8" rx="4" fill="#2A2A2A" />
      <rect x="142" y="226" width="170" height="8" rx="4" fill="#222222" />
      <rect x="142" y="246" width="140" height="8" rx="4" fill="#1A1A1A" />

      <!-- ========================================== -->
      <!-- THE HARDWARE RATING GAUGE (Industrial 5-Star) -->
      <!-- ========================================== -->
      <!-- Container Pill -->
      <rect x="142" y="280" width="208" height="48" rx="24" fill="#0A0A0A" />
      <rect x="142" y="280" width="208" height="48" rx="24" fill="none" stroke="#222222" stroke-width="2" />

      <!-- The 5 Hardware Rating Nodes (Glowing Yellow) -->
      <g transform="translate(166, 304)">
        <!-- Node 1 -->
        <circle cx="0" cy="0" r="12" fill="#000000" />
        <circle cx="0" cy="0" r="12" fill="none" stroke="#1A1A1A" stroke-width="2" />
        <circle cx="0" cy="0" r="8" fill="url(#yellowBadge)" filter="url(#blur-small)" opacity="0.6" />
        <circle cx="0" cy="0" r="8" fill="url(#yellowExt)" />
        <circle cx="0" cy="0" r="6" fill="#FFF080" />

        <!-- Node 2 -->
        <g transform="translate(40, 0)">
          <circle cx="0" cy="0" r="12" fill="#000000" />
          <circle cx="0" cy="0" r="12" fill="none" stroke="#1A1A1A" stroke-width="2" />
          <circle cx="0" cy="0" r="8" fill="url(#yellowBadge)" filter="url(#blur-small)" opacity="0.6" />
          <circle cx="0" cy="0" r="8" fill="url(#yellowExt)" />
          <circle cx="0" cy="0" r="6" fill="#FFF080" />
        </g>

        <!-- Node 3 -->
        <g transform="translate(80, 0)">
          <circle cx="0" cy="0" r="12" fill="#000000" />
          <circle cx="0" cy="0" r="12" fill="none" stroke="#1A1A1A" stroke-width="2" />
          <circle cx="0" cy="0" r="8" fill="url(#yellowBadge)" filter="url(#blur-small)" opacity="0.6" />
          <circle cx="0" cy="0" r="8" fill="url(#yellowExt)" />
          <circle cx="0" cy="0" r="6" fill="#FFF080" />
        </g>

        <!-- Node 4 -->
        <g transform="translate(120, 0)">
          <circle cx="0" cy="0" r="12" fill="#000000" />
          <circle cx="0" cy="0" r="12" fill="none" stroke="#1A1A1A" stroke-width="2" />
          <circle cx="0" cy="0" r="8" fill="url(#yellowBadge)" filter="url(#blur-small)" opacity="0.6" />
          <circle cx="0" cy="0" r="8" fill="url(#yellowExt)" />
          <circle cx="0" cy="0" r="6" fill="#FFF080" />
        </g>

        <!-- Node 5 -->
        <g transform="translate(160, 0)">
          <circle cx="0" cy="0" r="12" fill="#000000" />
          <circle cx="0" cy="0" r="12" fill="none" stroke="#1A1A1A" stroke-width="2" />
          <circle cx="0" cy="0" r="8" fill="url(#yellowBadge)" filter="url(#blur-small)" opacity="0.6" />
          <circle cx="0" cy="0" r="8" fill="url(#yellowExt)" />
          <circle cx="0" cy="0" r="6" fill="#FFF080" />
        </g>
      </g>
    </g>

    <!-- ========================================== -->
    <!-- 3. FLOATING TESTIMONIAL TOKEN (Top Left)   -->
    <!-- ========================================== -->
    <g id="testimonial-quote" transform="translate(110, 80) rotate(-15)">
      <!-- Token Drop Shadow -->
      <circle cx="0" cy="16" r="44" fill="#000000" opacity="0.5" filter="url(#blur-medium)" />

      <!-- Token Extrusion (Thick Volume) -->
      <circle cx="0" cy="8" r="44" fill="#8A6D00" />
      <circle cx="0" cy="4" r="44" fill="#B48E08" />

      <!-- Token Front Face (Vibrant Yellow) -->
      <circle cx="0" cy="0" r="44" fill="url(#yellowBadge)" />

      <!-- Glossy Rim Bevel -->
      <circle cx="0" cy="0" r="40" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.5" />
      <circle cx="0" cy="0" r="44" fill="none" stroke="#DCA10C" stroke-width="2" />

      <!-- Massive 3D Quotation Marks ("") -->
      <g transform="translate(0, 2)">
        <!-- Left Quote -->
        <g transform="translate(-14, -6)">
          <circle cx="0" cy="0" r="8" fill="#111111" />
          <path d="M -8 0 L 8 0 L 0 16 Z" fill="#111111" />
          <!-- Inner Highlight -->
          <circle cx="-2" cy="-2" r="4" fill="#333333" />
        </g>
        <!-- Right Quote -->
        <g transform="translate(14, -6)">
          <circle cx="0" cy="0" r="8" fill="#111111" />
          <path d="M -8 0 L 8 0 L 0 16 Z" fill="#111111" />
          <!-- Inner Highlight -->
          <circle cx="-2" cy="-2" r="4" fill="#333333" />
        </g>
      </g>
    </g>

    <!-- ========================================== -->
    <!-- 4. FLOATING QUALITY SEAL (Bottom Right)    -->
    <!-- ========================================== -->
    <!-- A massive, heavy industrial badge signifying a perfect score / top tier -->
    <g id="quality-seal" transform="translate(380, 310)">

      <!-- Seal Cast Shadow -->
      <g fill="#000000" opacity="0.6" filter="url(#blur-large)" transform="translate(0, 16)">
        <use href="#ribbed-edge" />
      </g>
      <g fill="#000000" opacity="0.5" filter="url(#blur-medium)" transform="translate(0, 8)">
        <use href="#ribbed-edge" />
      </g>

      <!-- Seal Extrusion (Thick Matte Hardware Volume) -->
      <g fill="#050505" transform="translate(0, 10)">
        <use href="#ribbed-edge" />
      </g>
      <g fill="#0A0A0A" transform="translate(0, 5)">
        <use href="#ribbed-edge" />
      </g>

      <!-- Seal Front Face (Matte Black) -->
      <g fill="url(#matteBlack)">
        <use href="#ribbed-edge" />
      </g>

      <!-- Glossy Outer Rings -->
      <circle cx="0" cy="0" r="50" fill="none" stroke="url(#edgeHighlight)" stroke-width="2" />
      <circle cx="0" cy="0" r="44" fill="none" stroke="#2A2A2A" stroke-width="2" />
      <circle cx="0" cy="0" r="40" fill="none" stroke="#000000" stroke-width="4" opacity="0.8" />

      <!-- Center Yellow Core (The High Rating Display) -->
      <circle cx="0" cy="0" r="38" fill="url(#yellowBadge)" />

      <!-- Core Inner Highlight -->
      <circle cx="0" cy="0" r="34" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.4" />

      <!-- The Massive "5.0" Metric Overlay -->
      <g transform="translate(0, -2)">
        <!-- Text Shadow for 3D effect -->
        <g fill="#A17E00" transform="translate(0, 3)">
          <!-- "5" -->
          <rect x="-24" y="-12" width="16" height="6" rx="2" />
          <rect x="-24" y="-12" width="6" height="14" rx="2" />
          <path d="M -24 0 C -12 0, -8 4, -8 10 C -8 16, -14 20, -24 20" fill="none" stroke="#A17E00" stroke-width="6" stroke-linecap="round" />
          <!-- "." -->
          <circle cx="-2" cy="18" r="3" />
          <!-- "0" -->
          <rect x="6" y="-12" width="16" height="32" rx="8" />
        </g>

        <!-- Matte Black "5.0" Body -->
        <g fill="#111111">
          <!-- "5" -->
          <rect x="-24" y="-12" width="16" height="6" rx="2" />
          <rect x="-24" y="-12" width="6" height="14" rx="2" />
          <path d="M -24 0 C -12 0, -8 4, -8 10 C -8 16, -14 20, -24 20" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round" />
          <!-- "." -->
          <circle cx="-2" cy="18" r="3" />
          <!-- "0" (Outer) -->
          <rect x="6" y="-12" width="16" height="32" rx="8" />
        </g>

        <!-- "0" Inner Cutout -->
        <rect x="10" y="-6" width="8" height="20" rx="4" fill="url(#yellowBadge)" />

        <!-- Glossy Font Highlights -->
        <g fill="none" stroke="#333333" stroke-width="1.5">
          <rect x="-23" y="-11" width="14" height="4" rx="1" />
          <rect x="7" y="-11" width="14" height="30" rx="7" />
        </g>
      </g>
    </g>

    <!-- ========================================== -->
    <!-- 5. FLOATING AMBIENT PARTICLES / SPARKS     -->
    <!-- ========================================== -->

    <!-- Top Right Sparkle -->
    <g transform="translate(360, 20) scale(0.8)">
      <path d="M 0 -16 C 0 -4, 4 0, 16 0 C 4 0, 0 4, 0 16 C 0 4, -4 0, -16 0 C -4 0, 0 -4, 0 -16 Z" fill="#FACC15" filter="url(#blur-small)" opacity="0.8" />
      <path d="M 0 -12 C 0 -3, 3 0, 12 0 C 3 0, 0 3, 0 12 C 0 3, -3 0, -12 0 C -3 0, 0 -3, 0 -12 Z" fill="#FFF080" />
    </g>

    <!-- Bottom Left Orb -->
    <g transform="translate(80, 260)">
      <circle cx="0" cy="12" r="12" fill="#000000" opacity="0.4" filter="url(#blur-medium)" />
      <circle cx="0" cy="0" r="12" fill="url(#yellowBadge)" />
      <circle cx="-3" cy="-3" r="5" fill="#FFFFFF" opacity="0.6" filter="url(#blur-small)" />
    </g>

  </g>
</svg>