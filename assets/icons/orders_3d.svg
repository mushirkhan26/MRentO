<svg viewBox="0 0 512 512" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft 3D Shadow Filters for Depth and Floating Effects -->
    <filter id="blur-large" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
    <filter id="blur-medium" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
    <filter id="blur-small" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" />
    </filter>

    <!-- Premium Matte Black Materials (House Body & UI Elements) -->
    <linearGradient id="matteBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2D2D"/>
      <stop offset="40%" stop-color="#151515"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>

    <linearGradient id="matteBlackDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="50%" stop-color="#080808"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <linearGradient id="edgeHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A4A4A"/>
      <stop offset="30%" stop-color="#222222"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <!-- Vibrant Yellow Materials (Roof, Badges, Highlights) -->
    <linearGradient id="yellowRoof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#B48E08"/>
    </linearGradient>

    <linearGradient id="yellowRoofExt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCA10C"/>
      <stop offset="50%" stop-color="#8A6D00"/>
      <stop offset="100%" stop-color="#4D3D00"/>
    </linearGradient>

    <linearGradient id="yellowBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF080"/>
      <stop offset="30%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#A17E00"/>
    </linearGradient>

    <radialGradient id="yellowSphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF080"/>
      <stop offset="40%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#8A6D00"/>
    </radialGradient>
  </defs>

  <!-- Global Floor Shadows (Grounds the floating composition) -->
  <ellipse cx="256" cy="460" rx="170" ry="24" fill="#000000" opacity="0.35" filter="url(#blur-large)" />
  <ellipse cx="256" cy="460" rx="100" ry="12" fill="#000000" opacity="0.5" filter="url(#blur-medium)" />

  <!-- Background Floating Sphere (Adds 3D spatial depth) -->
  <g transform="translate(130, 150)">
    <circle cx="0" cy="24" r="28" fill="#000000" opacity="0.5" filter="url(#blur-medium)" />
    <circle cx="0" cy="0" r="28" fill="url(#yellowSphere)" />
    <!-- Sphere Specular Highlight -->
    <circle cx="-8" cy="-8" r="10" fill="#FFFFFF" opacity="0.4" filter="url(#blur-small)" />
  </g>

  <!-- Main Composition Group (Slight isometric rotation for premium 3D feel) -->
  <g transform="translate(256, 256) rotate(-6) translate(-256, -256)">

    <!-- ========================================== -->
    <!-- BASEPLATE (Dashboard Widget Pedestal)        -->
    <!-- ========================================== -->
    <g transform="translate(0, 340)">
      <!-- Baseplate Cast Shadow -->
      <rect x="100" y="10" width="312" height="40" rx="20" fill="#000000" opacity="0.6" filter="url(#blur-medium)" />
      <!-- Baseplate Extrusion (Depth) -->
      <rect x="100" y="16" width="312" height="40" rx="20" fill="#050505" />
      <rect x="100" y="8" width="312" height="40" rx="20" fill="#0A0A0A" />
      <!-- Baseplate Front Face -->
      <rect x="100" y="0" width="312" height="40" rx="20" fill="url(#matteBlack)" />
      <!-- Baseplate Highlight -->
      <rect x="101" y="1" width="310" height="38" rx="19" fill="none" stroke="url(#edgeHighlight)" stroke-width="2" />
      <!-- Glowing Yellow Separation Line -->
      <rect x="120" y="0" width="272" height="2" fill="#FACC15" filter="url(#blur-small)" opacity="0.8" />
    </g>

    <!-- ========================================== -->
    <!-- CHIMNEY / HARDWARE ANTENNA                 -->
    <!-- ========================================== -->
    <g transform="translate(160, 50)">
      <!-- Chimney Extrusion -->
      <rect x="12" y="16" width="32" height="90" rx="8" fill="#050505" />
      <!-- Chimney Front -->
      <rect x="0" y="0" width="32" height="90" rx="8" fill="url(#matteBlack)" />
      <!-- Chimney Highlight -->
      <rect x="1" y="1" width="30" height="88" rx="7" fill="none" stroke="url(#edgeHighlight)" stroke-width="2" />
      <!-- Top Ring Extrusion -->
      <rect x="-4" y="14" width="40" height="16" rx="8" fill="#8A6D00" />
      <!-- Top Ring Front (Yellow) -->
      <rect x="-4" y="10" width="40" height="16" rx="8" fill="url(#yellowBadge)" />
    </g>

    <!-- ========================================== -->
    <!-- HOUSE BODY (Matte Black Block)             -->
    <!-- ========================================== -->
    <!-- Body Extrusion (Depth/Shadow) -->
    <rect x="168" y="174" width="176" height="170" rx="36" fill="url(#matteBlackDark)" />

    <!-- Body Front Face -->
    <rect x="156" y="150" width="176" height="194" rx="36" fill="url(#matteBlack)" />

    <!-- Body Glossy Bevel -->
    <rect x="157" y="151" width="174" height="192" rx="35" fill="none" stroke="url(#edgeHighlight)" stroke-width="2" />
    <!-- Top Edge Specular Reflection -->
    <rect x="176" y="152" width="136" height="2" rx="1" fill="#FFFFFF" opacity="0.1" />

    <!-- ========================================== -->
    <!-- HOUSE UI/DASHBOARD WIDGETS                 -->
    <!-- ========================================== -->
    <!-- Left Widget 1 (Stats/Graph) -->
    <g transform="translate(176, 230)">
      <rect x="0" y="0" width="36" height="36" rx="12" fill="#0A0A0A" stroke="#222222" stroke-width="2" />
      <rect x="8" y="20" width="6" height="8" rx="2" fill="#333333" />
      <rect x="16" y="14" width="6" height="14" rx="2" fill="#FACC15" />
      <rect x="24" y="22" width="6" height="6" rx="2" fill="#333333" />
    </g>

    <!-- Left Widget 2 (Notification Pill) -->
    <g transform="translate(176, 280)">
      <rect x="0" y="0" width="36" height="36" rx="12" fill="#0A0A0A" stroke="#222222" stroke-width="2" />
      <circle cx="18" cy="18" r="8" fill="none" stroke="#333333" stroke-width="4" />
      <circle cx="18" cy="18" r="8" fill="none" stroke="#FACC15" stroke-width="4" stroke-dasharray="25" stroke-dashoffset="10" stroke-linecap="round" />
    </g>

    <!-- Right Widget (Rental List Skeleton) -->
    <g transform="translate(284, 230)">
      <rect x="0" y="0" width="32" height="86" rx="12" fill="#0A0A0A" stroke="#222222" stroke-width="2" />
      <rect x="8" y="12" width="16" height="6" rx="3" fill="#FACC15" />
      <rect x="8" y="26" width="10" height="6" rx="3" fill="#333333" />
      <rect x="8" y="40" width="16" height="6" rx="3" fill="#333333" />
      <rect x="8" y="54" width="12" height="6" rx="3" fill="#333333" />
      <rect x="8" y="68" width="16" height="6" rx="3" fill="#333333" />
    </g>

    <!-- ========================================== -->
    <!-- MAIN DOOR (Smart Lock / Keyhole)           -->
    <!-- ========================================== -->
    <g transform="translate(224, 230)">
      <!-- Door Cavity (Inner Shadow) -->
      <rect x="0" y="0" width="48" height="100" rx="24" fill="#030303" />
      <rect x="0" y="0" width="48" height="100" rx="24" fill="none" stroke="#000000" stroke-width="6" />
      <!-- Door Panel -->
      <rect x="2" y="2" width="44" height="96" rx="22" fill="#111111" />
      <!-- Door Edge Highlight -->
      <rect x="2" y="2" width="44" height="96" rx="22" fill="none" stroke="#2A2A2A" stroke-width="1.5" />

      <!-- Glowing Smart Handle (Yellow LED Bar) -->
      <rect x="20" y="40" width="8" height="32" rx="4" fill="#FACC15" filter="url(#blur-small)" opacity="0.9" />
      <rect x="22" y="42" width="4" height="28" rx="2" fill="#FFFFFF" />
      <!-- Keyhole dot -->
      <circle cx="24" cy="24" r="3" fill="#555555" />
    </g>

    <!-- ========================================== -->
    <!-- FLOATING ROOF (Vibrant Yellow Clay)        -->
    <!-- ========================================== -->
    <!-- Roof Drop Shadow onto House -->
    <path d="M 116,230 L 256,120 L 396,230 L 396,260 L 256,150 L 116,260 Z" fill="#000000" opacity="0.55" filter="url(#blur-medium)" />

    <!-- Roof Extrusion (Thick 3D Depth) -->
    <path d="M 126, 210 L 256, 108 L 386, 210" fill="none" stroke="url(#yellowRoofExt)" stroke-width="60" stroke-linecap="round" stroke-linejoin="round" transform="translate(6, 20)" />

    <!-- Roof Front Face -->
    <path d="M 126, 210 L 256, 108 L 386, 210" fill="none" stroke="url(#yellowRoof)" stroke-width="60" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Roof Top Edge Specular Reflection (Glassy shine) -->
    <path d="M 126, 210 L 256, 108 L 386, 210" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.55" transform="translate(-2, -12)" />

    <!-- Roof Inner Bevel Groove -->
    <path d="M 126, 210 L 256, 108 L 386, 210" fill="none" stroke="#B48E08" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" transform="translate(0, 16)" />

    <!-- ========================================== -->
    <!-- RENTAL BADGE (Floating Yellow Key)         -->
    <!-- ========================================== -->
    <g transform="translate(380, 120)">
      <!-- Badge Cast Shadow -->
      <circle cx="0" cy="12" r="32" fill="#000000" opacity="0.5" filter="url(#blur-medium)" />
      <!-- Badge Extrusion -->
      <circle cx="4" cy="8" r="28" fill="#A17E00" />
      <circle cx="2" cy="4" r="28" fill="#C29A00" />
      <!-- Badge Front Face -->
      <circle cx="0" cy="0" r="28" fill="url(#yellowBadge)" />
      <!-- Badge Highlight -->
      <circle cx="0" cy="0" r="26" fill="none" stroke="#FFF080" stroke-width="2" />

      <!-- Premium Rental Key Icon (Matte Black) -->
      <g transform="rotate(40)">
        <!-- Key Ring Head -->
        <circle cx="-6" cy="0" r="8" fill="none" stroke="#111111" stroke-width="4.5" />
        <!-- Key Shaft -->
        <line x1="2" y1="0" x2="16" y2="0" stroke="#111111" stroke-width="4.5" stroke-linecap="round" />
        <!-- Key Teeth -->
        <line x1="8" y1="0" x2="8" y2="6" stroke="#111111" stroke-width="4.5" stroke-linecap="round" />
        <line x1="14" y1="0" x2="14" y2="6" stroke="#111111" stroke-width="4.5" stroke-linecap="round" />
      </g>
    </g>

    <!-- ========================================== -->
    <!-- FOREGROUND DASHBOARD PILL (Settings/Filter)-->
    <!-- ========================================== -->
    <g transform="translate(100, 390)">
      <!-- Pill Shadow -->
      <rect x="0" y="10" width="80" height="32" rx="16" fill="#000000" opacity="0.6" filter="url(#blur-medium)" />
      <!-- Pill Extrusion -->
      <rect x="2" y="4" width="80" height="32" rx="16" fill="#050505" />
      <!-- Pill Front -->
      <rect x="0" y="0" width="80" height="32" rx="16" fill="url(#matteBlack)" />
      <!-- Pill Highlight -->
      <rect x="1" y="1" width="78" height="30" rx="15" fill="none" stroke="url(#edgeHighlight)" stroke-width="1.5" />

      <!-- Sliders / Controls (UI Detail) -->
      <line x1="16" y1="16" x2="64" y2="16" stroke="#222222" stroke-width="4" stroke-linecap="round" />
      <!-- Active Slider Track -->
      <line x1="16" y1="16" x2="32" y2="16" stroke="#FACC15" stroke-width="4" stroke-linecap="round" />
      <!-- Slider Knob 1 (Yellow) -->
      <circle cx="32" cy="16" r="6" fill="#FACC15" />
      <!-- Slider Knob 2 (Dark) -->
      <circle cx="54" cy="16" r="6" fill="#1A1A1A" stroke="#555555" stroke-width="2" />
    </g>

  </g>
</svg>