<svg viewBox="0 0 512 512" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft 3D Shadow Filters for Depth and Claymorphism -->
    <filter id="blur-large" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
    <filter id="blur-medium" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
    <filter id="blur-small" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" />
    </filter>

    <!-- Premium Matte Black Materials -->
    <linearGradient id="matteBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2D2D"/>
      <stop offset="40%" stop-color="#151515"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>

    <linearGradient id="matteBlackDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="50%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Edge Highlight for Glossy Bevels -->
    <linearGradient id="edgeHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#555555"/>
      <stop offset="30%" stop-color="#222222"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <!-- Vibrant Yellow Metallic & Clay Materials -->
    <linearGradient id="yellowBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF080"/>
      <stop offset="30%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#A17E00"/>
    </linearGradient>

    <linearGradient id="yellowExt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCA10C"/>
      <stop offset="50%" stop-color="#8A6D00"/>
      <stop offset="100%" stop-color="#4D3D00"/>
    </linearGradient>

    <!-- Ambient Glowing Spheres -->
    <radialGradient id="yellowSphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF080"/>
      <stop offset="40%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#8A6D00"/>
    </radialGradient>
  </defs>

  <!-- ========================================== -->
  <!-- GLOBAL FLOOR SHADOWS                       -->
  <!-- ========================================== -->
  <ellipse cx="256" cy="460" rx="160" ry="24" fill="#000000" opacity="0.35" filter="url(#blur-large)" />
  <ellipse cx="256" cy="460" rx="90" ry="12" fill="#000000" opacity="0.5" filter="url(#blur-medium)" />

  <!-- ========================================== -->
  <!-- BACKGROUND FLOATING ELEMENTS               -->
  <!-- ========================================== -->
  <!-- Floating Yellow Sphere (Top Left) -->
  <g transform="translate(130, 140)">
    <circle cx="0" cy="16" r="18" fill="#000000" opacity="0.4" filter="url(#blur-medium)" />
    <circle cx="0" cy="0" r="18" fill="url(#yellowSphere)" />
    <circle cx="-5" cy="-5" r="6" fill="#FFFFFF" opacity="0.4" filter="url(#blur-small)" />
  </g>

  <!-- Floating Star/Sparkle (Bottom Right) -->
  <g transform="translate(420, 340) scale(0.8)">
    <path d="M 0,-16 C 0,-4 4,0 16,0 C 4,0 0,4 0,16 C 0,4 -4,0 -16,0 C -4,0 0,-4 0,-16 Z" fill="#FACC15" filter="url(#blur-small)" opacity="0.8" />
    <path d="M 0,-12 C 0,-3 3,0 12,0 C 3,0 0,3 0,12 C 0,3 -3,0 -12,0 C -3,0 0,-3 0,-12 Z" fill="#FFF080" />
  </g>

  <!-- MASTER GROUP: Isometric Tilt (-8 degrees) -->
  <g transform="translate(256, 256) rotate(-8) translate(-256, -256)">

    <!-- ========================================== -->
    <!-- 1. MAIN LEGAL DOCUMENT (Thick Matte Tablet)-->
    <!-- ========================================== -->
    <g id="document-tablet">
      <!-- Tablet Cast Shadow -->
      <rect x="136" y="106" width="240" height="320" rx="24" fill="#000000" opacity="0.6" filter="url(#blur-large)" transform="translate(0, 24)" />

      <!-- Tablet Extrusion (Depth) -->
      <rect x="136" y="86" width="240" height="320" rx="24" fill="#050505" transform="translate(0, 16)" />
      <rect x="136" y="86" width="240" height="320" rx="24" fill="#0A0A0A" transform="translate(0, 8)" />

      <!-- Tablet Front Face -->
      <rect x="136" y="86" width="240" height="320" rx="24" fill="url(#matteBlack)" />

      <!-- Glossy Edge Highlight -->
      <rect x="137" y="87" width="238" height="318" rx="23" fill="none" stroke="url(#edgeHighlight)" stroke-width="2" />
      <rect x="156" y="88" width="200" height="2" rx="1" fill="#FFFFFF" opacity="0.12" />
    </g>

    <!-- ========================================== -->
    <!-- 2. DOCUMENT SKELETON UI (Terms & Clauses)  -->
    <!-- ========================================== -->
    <g id="document-content" transform="translate(0, -6)">
      <!-- Document Header -->
      <rect x="172" y="130" width="100" height="12" rx="6" fill="#4A4A4A" />
      <rect x="172" y="150" width="168" height="2" fill="#222222" />

      <!-- Paragraph 1 (Intro) -->
      <rect x="172" y="164" width="168" height="8" rx="4" fill="#1A1A1A" />
      <rect x="172" y="180" width="140" height="8" rx="4" fill="#1A1A1A" />
      <rect x="172" y="196" width="80" height="8" rx="4" fill="#1A1A1A" />

      <!-- Highlighted Clause (Yellow) -->
      <rect x="172" y="220" width="12" height="12" rx="3" fill="url(#yellowBadge)" />
      <rect x="194" y="222" width="120" height="8" rx="4" fill="#333333" />
      <rect x="194" y="236" width="90" height="8" rx="4" fill="#1A1A1A" />

      <!-- Second Clause -->
      <rect x="172" y="256" width="12" height="12" rx="3" fill="#1A1A1A" stroke="#333333" stroke-width="1.5" />
      <rect x="194" y="258" width="140" height="8" rx="4" fill="#1A1A1A" />
      <rect x="194" y="272" width="110" height="8" rx="4" fill="#1A1A1A" />
    </g>

    <!-- ========================================== -->
    <!-- 3. ACTION / AGREEMENT BLOCK (Bottom Left)  -->
    <!-- ========================================== -->
    <g id="signature-block" transform="translate(160, 310)">
      <!-- Dark container for signature area -->
      <rect x="0" y="0" width="140" height="60" rx="16" fill="#0A0A0A" />
      <rect x="0" y="0" width="140" height="60" rx="16" fill="none" stroke="#222222" stroke-width="2" />

      <!-- 'Sign Here' X Icon -->
      <path d="M 16 20 L 26 30 M 16 30 L 26 20" fill="none" stroke="#FACC15" stroke-width="3" stroke-linecap="round" opacity="0.8" />
      <!-- Signature Line -->
      <rect x="36" y="28" width="84" height="2" fill="#333333" />

      <!-- Digital Sign Squiggle (Matte Yellow) -->
      <path d="M 40 22 C 48 10, 50 30, 60 20 C 70 10, 75 26, 80 20 C 90 10, 95 24, 110 16" fill="none" stroke="#FACC15" stroke-width="3" stroke-linecap="round" opacity="0.9" />

      <!-- Small Security Lock Icon -->
      <rect x="16" y="40" width="10" height="8" rx="2" fill="#555555" />
      <path d="M 18 40 L 18 36 C 18 32, 24 32, 24 36 L 24 40" fill="none" stroke="#555555" stroke-width="2" />
      <rect x="32" y="42" width="60" height="4" rx="2" fill="#222222" />
    </g>

    <!-- ========================================== -->
    <!-- 4. TOP INDUSTRIAL BINDER CLIP              -->
    <!-- ========================================== -->
    <!-- Secures the "document", gives an industrial rental aesthetic -->
    <g id="clipboard-hardware" transform="translate(256, 76)">
      <!-- Clip Cast Shadow -->
      <rect x="-60" y="0" width="120" height="40" rx="12" fill="#000000" opacity="0.6" filter="url(#blur-small)" transform="translate(0, 10)" />

      <!-- Clip Extrusion -->
      <rect x="-56" y="-16" width="112" height="46" rx="12" fill="url(#yellowExt)" transform="translate(0, 6)" />
      <rect x="-56" y="-16" width="112" height="46" rx="12" fill="url(#yellowBadge)" />

      <!-- Clip Highlight -->
      <rect x="-54" y="-14" width="108" height="42" rx="10" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.5" />

      <!-- Mechanical Rivets -->
      <circle cx="-36" cy="6" r="6" fill="#111111" />
      <circle cx="-36" cy="6" r="6" fill="none" stroke="#4A4A4A" stroke-width="1.5" />

      <circle cx="36" cy="6" r="6" fill="#111111" />
      <circle cx="36" cy="6" r="6" fill="none" stroke="#4A4A4A" stroke-width="1.5" />

      <!-- Central Clamp Bar (Matte Black) -->
      <rect x="-70" y="24" width="140" height="14" rx="7" fill="#050505" transform="translate(0, 4)" />
      <rect x="-70" y="24" width="140" height="14" rx="7" fill="url(#matteBlackDark)" />
      <rect x="-68" y="25" width="136" height="12" rx="6" fill="none" stroke="#333333" stroke-width="1.5" />
    </g>

    <!-- ========================================== -->
    <!-- 5. VERIFICATION SHIELD / COMPLIANCE SEAL   -->
    <!-- ========================================== -->
    <!-- Anchors the legal/compliance theme, overlapping the bottom right -->
    <g id="policy-shield" transform="translate(370, 310)">

      <!-- Shield Cast Shadow -->
      <path d="M 0 -54 L 46 -30 L 46 20 C 46 60, 0 90, 0 90 C 0 90, -46 60, -46 20 L -46 -30 Z" fill="#000000" opacity="0.65" filter="url(#blur-large)" transform="translate(0, 16)" />

      <!-- Shield Extrusion (Thick 3D Volume) -->
      <path d="M 0 -54 L 46 -30 L 46 20 C 46 60, 0 90, 0 90 C 0 90, -46 60, -46 20 L -46 -30 Z" fill="#8A6D00" transform="translate(0, 12)" />
      <path d="M 0 -54 L 46 -30 L 46 20 C 46 60, 0 90, 0 90 C 0 90, -46 60, -46 20 L -46 -30 Z" fill="#B48E08" transform="translate(0, 6)" />

      <!-- Shield Front Face -->
      <path d="M 0 -54 L 46 -30 L 46 20 C 46 60, 0 90, 0 90 C 0 90, -46 60, -46 20 L -46 -30 Z" fill="url(#yellowBadge)" />

      <!-- Inner Bevel (Creates an inset crest) -->
      <path d="M 0 -44 L 36 -24 L 36 16 C 36 50, 0 76, 0 76 C 0 76, -36 50, -36 16 L -36 -24 Z" fill="none" stroke="#DCA10C" stroke-width="4" opacity="0.8" />
      <path d="M 0 -44 L 36 -24 L 36 16 C 36 50, 0 76, 0 76 C 0 76, -36 50, -36 16 L -36 -24 Z" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6" transform="translate(0, -2)" />

      <!-- Massive Matte Black Checkmark (Agreement Confirmed) -->
      <g transform="translate(0, 6)">
        <!-- Checkmark Cast Shadow inside shield -->
        <path d="M -16 6 L -4 18 L 22 -14" fill="none" stroke="#8A6D00" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" transform="translate(0, 4)" />

        <!-- Checkmark Body -->
        <path d="M -16 6 L -4 18 L 22 -14" fill="none" stroke="#111111" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

        <!-- Checkmark Highlight -->
        <path d="M -16 6 L -4 18 L 22 -14" fill="none" stroke="#333333" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" transform="translate(0, -2)" />
      </g>
    </g>

  </g>
</svg>