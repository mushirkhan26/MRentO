<svg viewBox="0 0 512 512" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft 3D Shadow Filters -->
    <filter id="blur-large" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" />
    </filter>
    <filter id="blur-medium" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
    <filter id="blur-small" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" />
    </filter>

    <!-- Matte Black Materials -->
    <linearGradient id="matteBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A2A2A"/>
      <stop offset="50%" stop-color="#151515"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>

    <linearGradient id="edgeHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#555555"/>
      <stop offset="30%" stop-color="#2A2A2A"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <!-- Vibrant Yellow Metallic Materials -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="25%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#DCA10C"/>
      <stop offset="80%" stop-color="#B48E08"/>
      <stop offset="100%" stop-color="#735A00"/>
    </linearGradient>

    <radialGradient id="yellowSphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF080"/>
      <stop offset="40%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#8A6D00"/>
    </radialGradient>

    <linearGradient id="yellowBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="30%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#B48E08"/>
    </linearGradient>

    <!-- 3D Checkmark Materials -->
    <linearGradient id="checkBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#B48E08"/>
    </linearGradient>

    <linearGradient id="checkHigh1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#DCA10C"/>
    </linearGradient>

    <linearGradient id="checkHigh2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>
  </defs>

  <!-- Global Floor Shadow for Floating Effect -->
  <ellipse cx="256" cy="460" rx="160" ry="30" fill="#000000" opacity="0.25" filter="url(#blur-large)" />
  <ellipse cx="256" cy="460" rx="90" ry="16" fill="#000000" opacity="0.4" filter="url(#blur-medium)" />

  <!-- Background Floating Sphere -->
  <g transform="translate(130, 150)">
    <!-- Sphere Shadow -->
    <circle cx="0" cy="24" r="28" fill="#000000" opacity="0.5" filter="url(#blur-medium)" />
    <!-- Sphere Base -->
    <circle cx="0" cy="0" r="28" fill="url(#yellowSphere)" />
    <!-- Sphere Specular Highlight -->
    <circle cx="-8" cy="-8" r="10" fill="#FFFFFF" opacity="0.4" filter="url(#blur-small)" />
  </g>

  <!-- Main Central 3D Order Calendar -->
  <g transform="translate(256, 256) rotate(-12) translate(-256, -256)">

    <!-- Deep Drop Shadow from Calendar Board -->
    <rect x="136" y="136" width="240" height="280" rx="40" fill="#000000" opacity="0.45" filter="url(#blur-large)" />
    <rect x="136" y="116" width="240" height="280" rx="40" fill="#000000" opacity="0.5" filter="url(#blur-medium)" />

    <!-- Calendar 3D Extrusion (Thickness/Depth) -->
    <rect x="136" y="116" width="240" height="280" rx="40" fill="#050505" />
    <rect x="136" y="106" width="240" height="280" rx="40" fill="#0A0A0A" />

    <!-- Calendar Front Face (Matte Black) -->
    <rect x="136" y="96" width="240" height="280" rx="40" fill="url(#matteBlack)" />

    <!-- Glossy Bevel Edge -->
    <rect x="137" y="97" width="238" height="278" rx="39" fill="none" stroke="url(#edgeHighlight)" stroke-width="2" />
    <rect x="144" y="98" width="224" height="2" rx="1" fill="#FFFFFF" opacity="0.12" />

    <!-- Calendar Binding Holes (Dark Recesses) -->
    <circle cx="196" cy="126" r="14" fill="#050505" />
    <circle cx="316" cy="126" r="14" fill="#050505" />

    <!-- Binding Ring Drop Shadows (Casting onto Calendar) -->
    <rect x="182" y="106" width="28" height="30" rx="14" fill="#000000" opacity="0.6" filter="url(#blur-small)" />
    <rect x="302" y="106" width="28" height="30" rx="14" fill="#000000" opacity="0.6" filter="url(#blur-small)" />

    <!-- Metallic Yellow Binding Rings (3D Cylinders) -->
    <rect x="186" y="66" width="20" height="60" rx="10" fill="url(#ringGrad)" />
    <rect x="306" y="66" width="20" height="60" rx="10" fill="url(#ringGrad)" />

    <!-- Hole Bottom Rims (Creates illusion rings are inserted) -->
    <path d="M 182,126 A 14,14 0 0,0 210,126" fill="none" stroke="#3A3A3A" stroke-width="2" />
    <path d="M 302,126 A 14,14 0 0,0 330,126" fill="none" stroke="#3A3A3A" stroke-width="2" />

    <!-- Header Debossed Separation Groove -->
    <line x1="136" y1="154" x2="376" y2="154" stroke="#050505" stroke-width="3" stroke-linecap="round"/>
    <line x1="136" y1="156" x2="376" y2="156" stroke="#222222" stroke-width="1.5" stroke-linecap="round"/>

    <!-- SaaS Skeleton UI Lines (Order Context) -->
    <g opacity="0.85">
      <!-- Section Title Line -->
      <rect x="176" y="174" width="60" height="10" rx="5" fill="#333333" />

      <!-- Content Detail Lines -->
      <rect x="176" y="196" width="140" height="10" rx="5" fill="#1F1F1F" />
      <rect x="176" y="216" width="110" height="10" rx="5" fill="#1F1F1F" />
      <rect x="176" y="236" width="130" height="10" rx="5" fill="#1F1F1F" />

      <!-- Total Price / Confirmation Box (Recessed 3D effect) -->
      <rect x="176" y="306" width="160" height="44" rx="12" fill="#000000" />
      <rect x="176" y="300" width="160" height="44" rx="12" fill="#151515" />
      <rect x="176" y="300" width="160" height="44" rx="12" fill="none" stroke="#2A2A2A" stroke-width="1.5" />

      <!-- Inner Action Skeleton -->
      <rect x="192" y="316" width="40" height="12" rx="6" fill="#2A2A2A" />
      <circle cx="312" cy="322" r="10" fill="#FACC15" />
      <circle cx="312" cy="322" r="8" fill="none" stroke="#FFF080" stroke-width="1.5" />
    </g>

    <!-- Glowing Order Notification Badge (Top Right Corner) -->
    <g transform="translate(366, 96)">
      <!-- Badge Extrusion / Shadow -->
      <circle cx="0" cy="10" r="28" fill="#000000" opacity="0.6" filter="url(#blur-medium)" />
      <circle cx="0" cy="6" r="28" fill="#B48E08" />

      <!-- Badge Front Base -->
      <circle cx="0" cy="0" r="28" fill="url(#yellowBadge)" />

      <!-- Badge Highlight Rim -->
      <circle cx="0" cy="0" r="26" fill="none" stroke="#FFF080" stroke-width="2" />

      <!-- Action Bolt Icon inside Badge -->
      <path d="M 4,-14 L -10,2 L 0,2 L -4,14 L 10,-4 L 0,-4 Z" fill="#111111" stroke="#111111" stroke-width="2" stroke-linejoin="round" />
    </g>

    <!-- Floating Massive 3D Checkmark -->
    <g transform="translate(256, 236)">
      <!-- Checkmark Cast Shadows -->
      <path d="M -50,15 L -15,50 L 70,-35" fill="none" stroke="#000000" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" filter="url(#blur-large)" transform="translate(0, 35)"/>
      <path d="M -50,15 L -15,50 L 70,-35" fill="none" stroke="#000000" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" filter="url(#blur-medium)" transform="translate(0, 20)"/>

      <!-- Inner Radiant Glow -->
      <path d="M -50,15 L -15,50 L 70,-35" fill="none" stroke="#FACC15" stroke-width="50" stroke-linecap="round" stroke-linejoin="round" opacity="0.25" filter="url(#blur-large)" />

      <!-- Checkmark 3D Extrusion (Solid Yellow Depth) -->
      <path d="M -50,15 L -15,50 L 70,-35" fill="none" stroke="#8A6D00" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" transform="translate(0, 16)" />
      <path d="M -50,15 L -15,50 L 70,-35" fill="none" stroke="#B48E08" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" transform="translate(0, 8)" />

      <!-- Checkmark Front Face Base -->
      <path d="M -50,15 L -15,50 L 70,-35" fill="none" stroke="url(#checkBase)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Layered Inner Glows (Creates the thick tubular claymorphism look) -->
      <path d="M -50,15 L -15,50 L 70,-35" fill="none" stroke="url(#checkHigh1)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M -50,15 L -15,50 L 70,-35" fill="none" stroke="url(#checkHigh2)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Crisp Specular Highlight (Simulates glossy top-edge reflection) -->
      <path d="M -50,15 L -15,50 L 70,-35" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" transform="translate(0, -6)" />
    </g>
  </g>

  <!-- Foreground Floating Pill UI Element -->
  <g transform="translate(400, 350) rotate(-25)">
    <!-- Pill Soft Shadows -->
    <rect x="-40" y="-16" width="80" height="32" rx="16" fill="#000000" opacity="0.5" filter="url(#blur-large)" transform="translate(0, 30)" />
    <rect x="-40" y="-16" width="80" height="32" rx="16" fill="#000000" opacity="0.7" filter="url(#blur-medium)" transform="translate(0, 15)" />

    <!-- Pill Extrusion -->
    <rect x="-40" y="-16" width="80" height="32" rx="16" fill="#050505" transform="translate(0, 8)" />
    <rect x="-40" y="-16" width="80" height="32" rx="16" fill="#0A0A0A" transform="translate(0, 4)" />

    <!-- Pill Front Face (Matte Black) -->
    <rect x="-40" y="-16" width="80" height="32" rx="16" fill="url(#matteBlack)" />

    <!-- Pill Glossy Outer Edge -->
    <rect x="-39" y="-15" width="78" height="30" rx="15" fill="none" stroke="url(#edgeHighlight)" stroke-width="2" />

    <!-- Top Edge Specular Reflection -->
    <rect x="-32" y="-14" width="64" height="2" rx="1" fill="#FFFFFF" opacity="0.15" />

    <!-- Internal UI Details -->
    <circle cx="-16" cy="0" r="6" fill="#FACC15" />
    <circle cx="-16" cy="0" r="4" fill="none" stroke="#FFF080" stroke-width="1" />
    <rect x="-2" y="-3" width="26" height="6" rx="3" fill="#333333" />
  </g>
</svg>