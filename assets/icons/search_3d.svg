<svg viewBox="0 0 512 512" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft 3D Shadow Filters for Depth and Claymorphism -->
    <filter id="blur-large" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
    <filter id="blur-medium" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
    <filter id="blur-small" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" />
    </filter>

    <!-- Premium Matte Black Materials -->
    <linearGradient id="matteBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2D2D"/>
      <stop offset="40%" stop-color="#151515"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>

    <linearGradient id="matteBlackDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="50%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Edge Highlight for Glossy Bevels -->
    <linearGradient id="edgeHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#555555"/>
      <stop offset="30%" stop-color="#222222"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <!-- Vibrant Yellow Metallic & Clay Materials -->
    <linearGradient id="yellowBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF080"/>
      <stop offset="30%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#A17E00"/>
    </linearGradient>

    <linearGradient id="yellowExt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCA10C"/>
      <stop offset="50%" stop-color="#8A6D00"/>
      <stop offset="100%" stop-color="#4D3D00"/>
    </linearGradient>

    <!-- Smart Lens Glass Glowing Materials -->
    <radialGradient id="glassGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#FACC15" stop-opacity="0.15"/>
      <stop offset="80%" stop-color="#FACC15" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#A17E00" stop-opacity="0.5"/>
    </radialGradient>

    <radialGradient id="innerScannerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#FACC15" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ========================================== -->
  <!-- GLOBAL FLOOR SHADOWS                       -->
  <!-- ========================================== -->
  <ellipse cx="256" cy="450" rx="170" ry="26" fill="#000000" opacity="0.35" filter="url(#blur-large)" />
  <ellipse cx="256" cy="450" rx="100" ry="14" fill="#000000" opacity="0.5" filter="url(#blur-medium)" />

  <!-- Background Floating Sparkles (Depth Indicators) -->
  <g transform="translate(100, 160)">
    <circle cx="0" cy="16" r="14" fill="#000000" opacity="0.4" filter="url(#blur-medium)" />
    <circle cx="0" cy="0" r="14" fill="url(#yellowBadge)" />
    <circle cx="-4" cy="-4" r="6" fill="#FFFFFF" opacity="0.4" filter="url(#blur-small)" />
  </g>
  <circle cx="420" cy="340" r="8" fill="#FACC15" opacity="0.6" filter="url(#blur-small)" />
  <circle cx="420" cy="336" r="6" fill="#FFF080" opacity="0.8" />

  <!-- ========================================== -->
  <!-- FLOATING ASSET 1: SEARCH FILTER PILL       -->
  <!-- ========================================== -->
  <g transform="translate(380, 150) rotate(15)">
    <!-- Shadow -->
    <rect x="-40" y="-24" width="80" height="48" rx="24" fill="#000000" opacity="0.6" filter="url(#blur-medium)" transform="translate(0, 12)" />
    <!-- Extrusion / Depth -->
    <rect x="-40" y="-24" width="80" height="48" rx="24" fill="#050505" transform="translate(0, 8)" />
    <rect x="-40" y="-24" width="80" height="48" rx="24" fill="#0A0A0A" transform="translate(0, 4)" />
    <!-- Front Face -->
    <rect x="-40" y="-24" width="80" height="48" rx="24" fill="url(#matteBlack)" />
    <!-- Glossy Edge Highlight -->
    <rect x="-38" y="-22" width="76" height="44" rx="22" fill="none" stroke="url(#edgeHighlight)" stroke-width="2" />

    <!-- UI Sliders (Filtering Rentals) -->
    <path d="M -16 -8 L 16 -8 M -16 8 L 16 8" fill="none" stroke="#222222" stroke-width="4" stroke-linecap="round" />
    <path d="M -16 -8 L -4 -8 M -16 8 L 8 8" fill="none" stroke="#FACC15" stroke-width="4" stroke-linecap="round" />
    <!-- Active Knobs -->
    <circle cx="-4" cy="-8" r="6" fill="#FACC15" />
    <circle cx="8" cy="8" r="6" fill="#FACC15" />
  </g>

  <!-- ========================================== -->
  <!-- MAIN LENS GROUP (ISOMETRIC TILT)           -->
  <!-- ========================================== -->
  <!-- Rotated -35 degrees to create a dynamic, premium 3D angle -->
  <g transform="translate(256, 256) rotate(-35)">

    <!-- ========================================== -->
    <!-- 1. INDUSTRIAL GRIP HANDLE                  -->
    <!-- ========================================== -->
    <g id="handle">
      <!-- Handle Cast Shadow -->
      <rect x="-24" y="20" width="48" height="150" rx="16" fill="#000000" opacity="0.6" filter="url(#blur-medium)" transform="translate(0, 16)" />

      <!-- Top Connection Base (Black) -->
      <rect x="-16" y="20" width="32" height="40" rx="8" fill="#050505" />

      <!-- Metallic Yellow Connector Ring -->
      <rect x="-22" y="46" width="44" height="24" rx="6" fill="url(#yellowExt)" transform="translate(0, 4)" />
      <rect x="-22" y="46" width="44" height="24" rx="6" fill="url(#yellowBadge)" />
      <rect x="-20" y="48" width="40" height="20" rx="4" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.4" />

      <!-- Main Matte Black Grip Extrusion -->
      <rect x="-18" y="66" width="36" height="100" rx="12" fill="url(#matteBlackDark)" transform="translate(0, 6)" />
      <!-- Main Matte Black Grip Front -->
      <rect x="-18" y="66" width="36" height="100" rx="12" fill="url(#matteBlack)" />
      <!-- Grip Edge Highlight -->
      <rect x="-16" y="68" width="32" height="96" rx="10" fill="none" stroke="url(#edgeHighlight)" stroke-width="2" />

      <!-- Tactile Rubber Grip Textures (Grooves) -->
      <path d="M -18 80 L 18 80 M -18 90 L 18 90 M -18 100 L 18 100 M -18 110 L 18 110 M -18 120 L 18 120 M -18 130 L 18 130 M -18 140 L 18 140" fill="none" stroke="#050505" stroke-width="3" />
      <path d="M -18 82 L 18 82 M -18 92 L 18 92 M -18 102 L 18 102 M -18 112 L 18 112 M -18 122 L 18 122 M -18 132 L 18 132 M -18 142 L 18 142" fill="none" stroke="#2A2A2A" stroke-width="1" />

      <!-- Yellow End Cap -->
      <rect x="-22" y="160" width="44" height="18" rx="8" fill="url(#yellowExt)" transform="translate(0, 4)" />
      <rect x="-22" y="160" width="44" height="18" rx="8" fill="url(#yellowBadge)" />
      <rect x="-20" y="162" width="40" height="14" rx="6" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.4" />
      <!-- Lanyard Hole -->
      <circle cx="0" cy="169" r="4" fill="#0A0A0A" />
    </g>

    <!-- ========================================== -->
    <!-- 2. THICK MATTE BLACK LENS RING             -->
    <!-- ========================================== -->
    <g id="lens-ring">
      <!-- Ring Cast Shadow -->
      <circle cx="0" cy="-60" r="100" fill="#000000" opacity="0.65" filter="url(#blur-large)" transform="translate(0, 16)" />

      <!-- Outer Ring Extrusion (Depth) -->
      <circle cx="0" cy="-70" r="94" fill="#0A0A0A" transform="translate(0, 8)" />
      <circle cx="0" cy="-70" r="94" fill="url(#matteBlackDark)" transform="translate(0, 4)" />

      <!-- Outer Ring Front Face -->
      <circle cx="0" cy="-80" r="94" fill="url(#matteBlack)" />

      <!-- Glossy Outer Bevel Highlight -->
      <circle cx="0" cy="-80" r="92" fill="none" stroke="url(#edgeHighlight)" stroke-width="3" />
      <path d="M -75 -130 A 90 90 0 0 1 75 -130" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.12" stroke-linecap="round" />

      <!-- Inner Cavity Base (Dark Recess) -->
      <circle cx="0" cy="-68" r="66" fill="#0A0A0A" />
      <circle cx="0" cy="-68" r="66" fill="url(#innerScannerGlow)" />

      <!-- Inner Wall Shadow (Creates the illusion of thickness) -->
      <circle cx="0" cy="-80" r="66" fill="none" stroke="#000000" stroke-width="12" opacity="0.8" />
      <circle cx="0" cy="-80" r="66" fill="none" stroke="#151515" stroke-width="4" />

      <!-- Inner Glowing Yellow Rim (Scanner edge) -->
      <circle cx="0" cy="-80" r="64" fill="none" stroke="url(#yellowBadge)" stroke-width="2" opacity="0.9" />
    </g>

    <!-- ========================================== -->
    <!-- 3. DISCOVERED ASSET: SMART RENTAL WRENCH   -->
    <!-- ========================================== -->
    <!-- Counter-rotated by +35 to appear perfectly vertical in the final composition -->
    <g transform="translate(0, -68) rotate(35)">

      <!-- HUD Scanning Grid Elements -->
      <circle cx="0" cy="0" r="46" fill="none" stroke="#FACC15" stroke-width="2" stroke-dasharray="6 8" opacity="0.6" />
      <circle cx="0" cy="0" r="54" fill="none" stroke="#FACC15" stroke-width="1" opacity="0.3" />
      <path d="M -60 0 L -48 0 M 48 0 L 60 0 M 0 -60 L 0 -48 M 0 48 L 0 60" fill="none" stroke="#FACC15" stroke-width="3" stroke-linecap="round" />

      <!-- Wrench Cast Shadow in Cavity -->
      <g filter="url(#blur-small)" opacity="0.7" transform="translate(0, 6)">
        <rect x="-8" y="-16" width="16" height="40" rx="8" fill="#000000" />
        <circle cx="0" cy="-20" r="16" fill="#000000" />
        <circle cx="0" cy="24" r="14" fill="#000000" />
      </g>

      <!-- Wrench Extrusion (Thick 3D Volume) -->
      <g transform="translate(0, 3)" fill="#8A6D00">
        <rect x="-8" y="-16" width="16" height="40" rx="8" />
        <circle cx="0" cy="-20" r="16" />
        <circle cx="0" cy="24" r="14" />
      </g>

      <!-- Wrench Front Face (Vibrant Yellow) -->
      <g fill="url(#yellowBadge)">
        <rect x="-8" y="-16" width="16" height="40" rx="8" />
        <circle cx="0" cy="-20" r="16" />
        <circle cx="0" cy="24" r="14" />
      </g>

      <!-- Wrench Details & Highlights -->
      <g stroke="#FFFFFF" stroke-width="2" opacity="0.4" fill="none">
        <rect x="-6" y="-14" width="12" height="36" rx="6" />
        <circle cx="0" cy="-20" r="14" />
        <circle cx="0" cy="24" r="12" />
      </g>

      <!-- Wrench Cutouts (Matching Cavity Base Color) -->
      <!-- Jaw Cutout -->
      <rect x="-8" y="-40" width="16" height="22" rx="4" fill="#0A0A0A" />
      <!-- Ring Hole Cutout -->
      <circle cx="0" cy="24" r="6" fill="#0A0A0A" />
      <circle cx="0" cy="24" r="6" fill="none" stroke="#DCA10C" stroke-width="2" opacity="0.8" />
    </g>

    <!-- ========================================== -->
    <!-- 4. TRANSLUCENT SMART GLASS LENS            -->
    <!-- ========================================== -->
    <g id="glass-lens">
      <!-- Translucent Glass Core -->
      <circle cx="0" cy="-80" r="64" fill="url(#glassGlow)" />

      <!-- Soft Specular Surface Reflection (Curved window glare) -->
      <ellipse cx="-20" cy="-105" rx="35" ry="16" transform="rotate(-30, -20, -105)" fill="#FFFFFF" opacity="0.25" />
      <ellipse cx="-25" cy="-115" rx="10" ry="4" transform="rotate(-30, -25, -115)" fill="#FFFFFF" opacity="0.4" />

      <!-- Lower Subtle Reflection -->
      <path d="M -40 -40 A 55 55 0 0 0 40 -40" fill="none" stroke="#FACC15" stroke-width="4" opacity="0.3" stroke-linecap="round" />
    </g>

  </g>

  <!-- ========================================== -->
  <!-- FLOATING ASSET 2: RENTAL/PRICE TAG         -->
  <!-- ========================================== -->
  <g transform="translate(110, 340) rotate(-20)">
    <!-- Shadow -->
    <rect x="-24" y="-36" width="48" height="72" rx="8" fill="#000000" opacity="0.5" filter="url(#blur-medium)" transform="translate(0, 12)" />

    <!-- Wire/Lanyard Hook -->
    <path d="M 0 -24 Q 15 -45 -10 -60" fill="none" stroke="#FACC15" stroke-width="3" stroke-linecap="round" />

    <!-- Extrusion / Depth -->
    <rect x="-24" y="-36" width="48" height="72" rx="8" fill="url(#yellowExt)" transform="translate(0, 6)" />

    <!-- Front Face -->
    <rect x="-24" y="-36" width="48" height="72" rx="8" fill="url(#yellowBadge)" />
    <!-- Glossy Highlight -->
    <rect x="-22" y="-34" width="44" height="68" rx="6" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.5" />

    <!-- Tag Details -->
    <circle cx="0" cy="-20" r="5" fill="#111111" />
    <!-- Barcode / Skeleton UI -->
    <rect x="-12" y="-2" width="24" height="4" rx="2" fill="#111111" />
    <rect x="-12" y="8" width="16" height="4" rx="2" fill="#111111" />
    <rect x="-12" y="18" width="24" height="4" rx="2" fill="#111111" />
  </g>

</svg>