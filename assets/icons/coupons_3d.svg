<svg viewBox="0 0 512 512" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft 3D Shadow Filters for Depth and Claymorphism -->
    <filter id="blur-large" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
    <filter id="blur-medium" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
    <filter id="blur-small" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" />
    </filter>

    <!-- Premium Matte Black Materials -->
    <linearGradient id="matteBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2D2D"/>
      <stop offset="40%" stop-color="#151515"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>

    <linearGradient id="matteBlackDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="50%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Edge Highlight for Glossy Bevels -->
    <linearGradient id="edgeHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#555555"/>
      <stop offset="30%" stop-color="#222222"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <!-- Vibrant Yellow Metallic & Clay Materials -->
    <linearGradient id="yellowBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF080"/>
      <stop offset="30%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#A17E00"/>
    </linearGradient>

    <linearGradient id="yellowExt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCA10C"/>
      <stop offset="50%" stop-color="#8A6D00"/>
      <stop offset="100%" stop-color="#4D3D00"/>
    </linearGradient>

    <!-- Ambient Glowing Spheres -->
    <radialGradient id="yellowSphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF080"/>
      <stop offset="40%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#8A6D00"/>
    </radialGradient>

    <!-- Reusable Main Ticket/Voucher Path -->
    <!-- Width: 200, Height: 300, Corner Radius: 20, Side Cutouts Radius: 30 -->
    <path id="ticket-body" d="M -80 -150 L 80 -150 A 20 20 0 0 1 100 -130 L 100 -30 A 30 30 0 0 0 100 30 L 100 130 A 20 20 0 0 1 80 150 L -80 150 A 20 20 0 0 1 -100 130 L -100 30 A 30 30 0 0 1 -100 -30 L -100 -130 A 20 20 0 0 1 -80 -150 Z" />

    <!-- Reusable Gear Teeth for the Promo Coin -->
    <g id="gear-teeth">
      <rect x="-60" y="-12" width="120" height="24" rx="4" />
      <rect x="-60" y="-12" width="120" height="24" rx="4" transform="rotate(30)" />
      <rect x="-60" y="-12" width="120" height="24" rx="4" transform="rotate(60)" />
      <rect x="-60" y="-12" width="120" height="24" rx="4" transform="rotate(90)" />
      <rect x="-60" y="-12" width="120" height="24" rx="4" transform="rotate(120)" />
      <rect x="-60" y="-12" width="120" height="24" rx="4" transform="rotate(150)" />
      <circle cx="0" cy="0" r="54" />
    </g>
  </defs>

  <!-- ========================================== -->
  <!-- GLOBAL FLOOR SHADOWS                       -->
  <!-- ========================================== -->
  <ellipse cx="256" cy="460" rx="160" ry="24" fill="#000000" opacity="0.35" filter="url(#blur-large)" />
  <ellipse cx="256" cy="460" rx="90" ry="12" fill="#000000" opacity="0.5" filter="url(#blur-medium)" />

  <!-- Soft Background Glow -->
  <circle cx="256" cy="256" r="160" fill="url(#yellowSphere)" opacity="0.12" filter="url(#blur-large)" />

  <!-- MASTER GROUP: Isometric Tilt (-12 degrees) centered at (256, 256) -->
  <g transform="translate(256, 256) rotate(-12)">

    <!-- ========================================== -->
    <!-- 1. MAIN RENTAL VOUCHER / TICKET            -->
    <!-- ========================================== -->
    <!-- Shifted slightly left to balance the heavy gear coin on the right -->
    <g transform="translate(-30, 0)">

      <!-- Ticket Drop Shadow -->
      <use href="#ticket-body" fill="#000000" opacity="0.6" filter="url(#blur-large)" transform="translate(0, 24)" />
      <use href="#ticket-body" fill="#000000" opacity="0.4" filter="url(#blur-medium)" transform="translate(0, 12)" />

      <!-- Ticket 3D Extrusion (Thick Matte Block) -->
      <use href="#ticket-body" fill="#050505" transform="translate(0, 16)" />
      <use href="#ticket-body" fill="#080808" transform="translate(0, 12)" />
      <use href="#ticket-body" fill="#0A0A0A" transform="translate(0, 8)" />
      <use href="#ticket-body" fill="#111111" transform="translate(0, 4)" />

      <!-- Ticket Front Face -->
      <use href="#ticket-body" fill="url(#matteBlack)" />

      <!-- Ticket Edge Highlight (Glossy Rim) -->
      <use href="#ticket-body" fill="none" stroke="url(#edgeHighlight)" stroke-width="2" />
      <use href="#ticket-body" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.15" transform="translate(0, -1)" />

      <!-- ========================================== -->
      <!-- TICKET INNER DETAILS (Rental / Promo UI)   -->
      <!-- ========================================== -->

      <!-- Top Industrial Rivet (Lanyard Hole) -->
      <g transform="translate(0, -100)">
        <circle cx="0" cy="0" r="18" fill="#151515" />
        <circle cx="0" cy="0" r="12" fill="#050505" />
        <circle cx="0" cy="0" r="12" fill="none" stroke="#2A2A2A" stroke-width="2" />
        <!-- Yellow Metal Grommet -->
        <circle cx="0" cy="0" r="18" fill="none" stroke="url(#yellowBadge)" stroke-width="4" />
        <circle cx="0" cy="0" r="18" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.4" />
      </g>

      <!-- Vibrant Yellow "DISCOUNT" Banner Block -->
      <rect x="-60" y="-50" width="120" height="28" rx="8" fill="url(#yellowBadge)" />
      <rect x="-60" y="-50" width="120" height="28" rx="8" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.5" />
      <!-- Banner UI Skeletons -->
      <rect x="-44" y="-40" width="88" height="8" rx="4" fill="#A17E00" />
      <rect x="-60" y="-12" width="80" height="6" rx="3" fill="#222222" />
      <rect x="-60" y="-2" width="50" height="6" rx="3" fill="#222222" />

      <!-- Center Perforation (Punched Holes) -->
      <g transform="translate(0, 30)">
        <!-- Horizontal indented groove -->
        <line x1="-66" y1="0" x2="66" y2="0" stroke="#0A0A0A" stroke-width="6" stroke-linecap="round" />
        <line x1="-66" y1="1" x2="66" y2="1" stroke="#2A2A2A" stroke-width="2" stroke-linecap="round" />

        <!-- Deep Punched Holes -->
        <circle cx="-50" cy="0" r="4" fill="#050505" stroke="#1A1A1A" stroke-width="1.5" />
        <circle cx="-25" cy="0" r="4" fill="#050505" stroke="#1A1A1A" stroke-width="1.5" />
        <circle cx="0" cy="0" r="4" fill="#050505" stroke="#1A1A1A" stroke-width="1.5" />
        <circle cx="25" cy="0" r="4" fill="#050505" stroke="#1A1A1A" stroke-width="1.5" />
        <circle cx="50" cy="0" r="4" fill="#050505" stroke="#1A1A1A" stroke-width="1.5" />
      </g>

      <!-- Bottom Barcode (Equipment Scan Aesthetic) -->
      <g transform="translate(0, 90)">
        <rect x="-60" y="-20" width="10" height="40" rx="4" fill="#151515" />
        <rect x="-42" y="-20" width="16" height="40" rx="4" fill="#1A1A1A" />
        <rect x="-18" y="-20" width="12" height="40" rx="4" fill="#222222" />
        <rect x="2" y="-20" width="24" height="40" rx="4" fill="#151515" />
        <rect x="34" y="-20" width="8" height="40" rx="4" fill="#1A1A1A" />
        <rect x="50" y="-20" width="10" height="40" rx="4" fill="#222222" />

        <!-- Subtle Barcode Edge Highlights -->
        <rect x="-60" y="-20" width="10" height="40" rx="4" fill="none" stroke="#2A2A2A" stroke-width="1" />
        <rect x="-42" y="-20" width="16" height="40" rx="4" fill="none" stroke="#2A2A2A" stroke-width="1" />
        <rect x="2" y="-20" width="24" height="40" rx="4" fill="none" stroke="#2A2A2A" stroke-width="1" />
      </g>
    </g>

    <!-- ========================================== -->
    <!-- 2. FLOATING % PROMO GEAR-COIN              -->
    <!-- ========================================== -->
    <!-- Positioned overlapping the bottom right cutout of the ticket -->
    <g transform="translate(80, 50)">

      <!-- Coin Drop Shadow -->
      <g fill="#000000" opacity="0.6" filter="url(#blur-medium)" transform="translate(0, 16)">
        <use href="#gear-teeth" />
      </g>

      <!-- Coin Extrusion (Thick Hardware Volume) -->
      <g fill="url(#yellowExt)" transform="translate(0, 10)">
        <use href="#gear-teeth" />
      </g>
      <g fill="#B48E08" transform="translate(0, 5)">
        <use href="#gear-teeth" />
      </g>

      <!-- Coin Front Face (Vibrant Yellow) -->
      <g fill="url(#yellowBadge)">
        <use href="#gear-teeth" />
      </g>

      <!-- Glossy Inner & Outer Rims -->
      <circle cx="0" cy="0" r="54" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.4" />
      <circle cx="0" cy="0" r="44" fill="none" stroke="#DCA10C" stroke-width="4" opacity="0.8" />
      <circle cx="0" cy="0" r="44" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5" transform="translate(0, -1)" />

      <!-- Massive 3D Percentage Symbol (%) -->
      <g transform="rotate(10)">
        <!-- % Symbol Drop Shadow -->
        <g fill="#A17E00" transform="translate(0, 3)">
          <rect x="-26" y="-6" width="52" height="12" rx="4" transform="rotate(-45)" />
          <circle cx="-16" cy="-16" r="10" />
          <circle cx="16" cy="16" r="10" />
        </g>

        <!-- % Symbol Body (Matte Black) -->
        <g fill="#111111">
          <rect x="-26" y="-6" width="52" height="12" rx="4" transform="rotate(-45)" />
          <circle cx="-16" cy="-16" r="10" />
          <circle cx="16" cy="16" r="10" />
        </g>

        <!-- % Symbol Inner Reflection / Bevel -->
        <g fill="none" stroke="#333333" stroke-width="2">
          <rect x="-25" y="-5" width="50" height="10" rx="3" transform="rotate(-45)" />
          <circle cx="-16" cy="-16" r="9" />
          <circle cx="16" cy="16" r="9" />
        </g>
      </g>
    </g>

    <!-- ========================================== -->
    <!-- 3. FLOATING UI PILL (Top Right - "Exclusive")-->
    <!-- ========================================== -->
    <g transform="translate(90, -120) rotate(15)">
      <!-- Pill Shadow -->
      <rect x="-40" y="-18" width="80" height="36" rx="18" fill="#000000" opacity="0.5" filter="url(#blur-medium)" transform="translate(0, 12)" />

      <!-- Pill Extrusion -->
      <rect x="-40" y="-18" width="80" height="36" rx="18" fill="#050505" transform="translate(0, 8)" />
      <rect x="-40" y="-18" width="80" height="36" rx="18" fill="#0A0A0A" transform="translate(0, 4)" />

      <!-- Pill Face -->
      <rect x="-40" y="-18" width="80" height="36" rx="18" fill="url(#matteBlack)" />
      <rect x="-38" y="-16" width="76" height="32" rx="16" fill="none" stroke="url(#edgeHighlight)" stroke-width="2" />

      <!-- Embedded Premium Star Icon -->
      <path d="M -16 -8 L -13 -3 L -6 -3 L -11 2 L -9 9 L -16 5 L -23 9 L -21 2 L -26 -3 L -19 -3 Z" fill="url(#yellowBadge)" />
      <path d="M -16 -8 L -13 -3 L -6 -3 L -11 2 L -9 9 L -16 5 L -23 9 L -21 2 L -26 -3 L -19 -3 Z" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.6" />

      <!-- UI Data Lines -->
      <rect x="0" y="-4" width="24" height="8" rx="4" fill="#333333" />
    </g>

    <!-- ========================================== -->
    <!-- 4. AMBIENT FLOATING SPARKLES / STARS       -->
    <!-- ========================================== -->

    <!-- Top Left Sparkle -->
    <g transform="translate(-140, -80) scale(0.9)">
      <path d="M 0 -16 C 0 -4, 4 0, 16 0 C 4 0, 0 4, 0 16 C 0 4, -4 0, -16 0 C -4 0, 0 -4, 0 -16 Z" fill="#FACC15" filter="url(#blur-small)" opacity="0.8" />
      <path d="M 0 -12 C 0 -3, 3 0, 12 0 C 3 0, 0 3, 0 12 C 0 3, -3 0, -12 0 C -3 0, 0 -3, 0 -12 Z" fill="#FFF080" />
    </g>

    <!-- Bottom Left Orb -->
    <g transform="translate(-110, 130)">
      <circle cx="0" cy="12" r="10" fill="#000000" opacity="0.4" filter="url(#blur-small)" />
      <circle cx="0" cy="0" r="10" fill="url(#yellowBadge)" />
      <circle cx="-2" cy="-2" r="4" fill="#FFFFFF" opacity="0.6" filter="url(#blur-small)" />
    </g>

    <!-- Right Center Tiny Sparkle -->
    <g transform="translate(180, -20) scale(0.6)">
      <path d="M 0 -16 C 0 -4, 4 0, 16 0 C 4 0, 0 4, 0 16 C 0 4, -4 0, -16 0 C -4 0, 0 -4, 0 -16 Z" fill="#FACC15" filter="url(#blur-small)" opacity="0.6" />
      <path d="M 0 -12 C 0 -3, 3 0, 12 0 C 3 0, 0 3, 0 12 C 0 3, -3 0, -12 0 C -3 0, 0 -3, 0 -12 Z" fill="#FFF080" />
    </g>

  </g>
</svg>