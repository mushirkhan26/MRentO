<svg viewBox="0 0 512 512" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft 3D Shadow Filters for Depth and Claymorphism -->
    <filter id="blur-large" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
    <filter id="blur-medium" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
    <filter id="blur-small" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" />
    </filter>

    <!-- Premium Matte Black Materials -->
    <linearGradient id="matteBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2D2D"/>
      <stop offset="40%" stop-color="#151515"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>

    <linearGradient id="matteBlackDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="50%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <linearGradient id="matteBlackLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A3A3A"/>
      <stop offset="50%" stop-color="#222222"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>

    <!-- Edge Highlight for Glossy Bevels -->
    <linearGradient id="edgeHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#555555"/>
      <stop offset="30%" stop-color="#222222"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <!-- Vibrant Yellow Metallic & Clay Materials -->
    <linearGradient id="yellowBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF080"/>
      <stop offset="30%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#A17E00"/>
    </linearGradient>

    <linearGradient id="yellowExt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCA10C"/>
      <stop offset="50%" stop-color="#8A6D00"/>
      <stop offset="100%" stop-color="#4D3D00"/>
    </linearGradient>

    <!-- Ambient Glowing Spheres -->
    <radialGradient id="yellowSphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF080"/>
      <stop offset="40%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#8A6D00"/>
    </radialGradient>

    <!-- Reusable Industrial Gear Path -->
    <g id="heavy-gear">
      <rect x="-64" y="-14" width="128" height="28" rx="6" />
      <rect x="-64" y="-14" width="128" height="28" rx="6" transform="rotate(30)" />
      <rect x="-64" y="-14" width="128" height="28" rx="6" transform="rotate(60)" />
      <rect x="-64" y="-14" width="128" height="28" rx="6" transform="rotate(90)" />
      <rect x="-64" y="-14" width="128" height="28" rx="6" transform="rotate(120)" />
      <rect x="-64" y="-14" width="128" height="28" rx="6" transform="rotate(150)" />
      <circle cx="0" cy="0" r="54" />
    </g>
  </defs>

  <!-- ========================================== -->
  <!-- GLOBAL FLOOR SHADOWS                       -->
  <!-- ========================================== -->
  <ellipse cx="256" cy="460" rx="180" ry="26" fill="#000000" opacity="0.35" filter="url(#blur-large)" />
  <ellipse cx="256" cy="460" rx="110" ry="14" fill="#000000" opacity="0.5" filter="url(#blur-medium)" />

  <!-- Background Floating Ambient Orbs -->
  <g transform="translate(100, 160)">
    <circle cx="0" cy="14" r="16" fill="#000000" opacity="0.4" filter="url(#blur-medium)" />
    <circle cx="0" cy="0" r="16" fill="url(#yellowSphere)" />
    <circle cx="-4" cy="-4" r="6" fill="#FFFFFF" opacity="0.4" filter="url(#blur-small)" />
  </g>

  <!-- MASTER GROUP: Isometric Tilt (-12 degrees) -->
  <g transform="translate(256, 256) rotate(-12) translate(-256, -256)">

    <!-- ========================================== -->
    <!-- 1. MAIN CONTROL HUB BASE (Matte Black Pad) -->
    <!-- ========================================== -->
    <g id="hub-base">
      <!-- Base Drop Shadow -->
      <rect x="90" y="140" width="332" height="240" rx="40" fill="#000000" opacity="0.6" filter="url(#blur-large)" transform="translate(0, 20)" />

      <!-- Base Extrusion (Thick 3D Volume) -->
      <rect x="90" y="140" width="332" height="240" rx="40" fill="#050505" transform="translate(0, 14)" />
      <rect x="90" y="140" width="332" height="240" rx="40" fill="#0A0A0A" transform="translate(0, 7)" />

      <!-- Base Front Face -->
      <rect x="90" y="140" width="332" height="240" rx="40" fill="url(#matteBlack)" />

      <!-- Glossy Outer Edge Highlight -->
      <rect x="91" y="141" width="330" height="238" rx="39" fill="none" stroke="url(#edgeHighlight)" stroke-width="2" />
      <rect x="110" y="142" width="292" height="2" rx="1" fill="#FFFFFF" opacity="0.1" />

      <!-- Corner Hardware Rivets / Hex Bolts -->
      <g opacity="0.8">
        <!-- Top Left -->
        <circle cx="130" cy="180" r="6" fill="#151515" />
        <circle cx="130" cy="180" r="6" fill="none" stroke="#222222" stroke-width="1.5" />
        <!-- Bottom Left -->
        <circle cx="130" cy="340" r="6" fill="#151515" />
        <circle cx="130" cy="340" r="6" fill="none" stroke="#222222" stroke-width="1.5" />
        <!-- Top Right -->
        <circle cx="382" cy="180" r="6" fill="#151515" />
        <circle cx="382" cy="180" r="6" fill="none" stroke="#222222" stroke-width="1.5" />
        <!-- Bottom Right -->
        <circle cx="382" cy="340" r="6" fill="#151515" />
        <circle cx="382" cy="340" r="6" fill="none" stroke="#222222" stroke-width="1.5" />
      </g>

      <!-- Panel UI Grid Lines (Tech Context) -->
      <rect x="110" y="196" width="30" height="4" rx="2" fill="#222222" />
      <rect x="110" y="206" width="20" height="4" rx="2" fill="#1A1A1A" />

      <!-- LED Power Indicator -->
      <circle cx="382" cy="220" r="4" fill="#FACC15" filter="url(#blur-small)" opacity="0.8" />
      <circle cx="382" cy="220" r="3" fill="#FFF080" />
    </g>

    <!-- ========================================== -->
    <!-- 2. HEAVY INDUSTRIAL GEAR DIAL (Settings)   -->
    <!-- ========================================== -->
    <!-- Central configuration element on the left -->
    <g id="gear-dial" transform="translate(190, 260)">

      <!-- Gear Drop Shadow onto panel -->
      <g fill="#000000" opacity="0.7" filter="url(#blur-medium)" transform="translate(0, 12)">
        <use href="#heavy-gear" />
      </g>

      <!-- Gear Extrusion (Thick Yellow Volume) -->
      <g fill="url(#yellowExt)" transform="translate(0, 6)">
        <use href="#heavy-gear" />
      </g>
      <g fill="#B48E08" transform="translate(0, 3)">
        <use href="#heavy-gear" />
      </g>

      <!-- Gear Front Face (Vibrant Yellow) -->
      <g fill="url(#yellowBadge)">
        <use href="#heavy-gear" />
      </g>

      <!-- Gear Glossy Highlight -->
      <circle cx="0" cy="0" r="52" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4" />

      <!-- Inner Matte Black Control Dial -->
      <!-- Dial Base/Shadow -->
      <circle cx="0" cy="0" r="40" fill="#050505" transform="translate(0, 4)" />
      <!-- Dial Extrusion -->
      <circle cx="0" cy="0" r="40" fill="url(#matteBlackDark)" />
      <!-- Dial Face -->
      <circle cx="0" cy="0" r="38" fill="url(#matteBlack)" />

      <!-- Dial Bevel Highlights -->
      <circle cx="0" cy="0" r="36" fill="none" stroke="url(#edgeHighlight)" stroke-width="2" />
      <circle cx="0" cy="0" r="36" fill="none" stroke="#000000" stroke-width="4" opacity="0.6" transform="translate(0, 2)" />

      <!-- Glowing Yellow Indicator Tick (Rotated to show selection) -->
      <g transform="rotate(45)">
        <!-- Tick Glow -->
        <rect x="-4" y="-30" width="8" height="14" rx="4" fill="#FACC15" filter="url(#blur-small)" opacity="0.8" />
        <!-- Tick Body -->
        <rect x="-4" y="-30" width="8" height="14" rx="4" fill="url(#yellowBadge)" />
        <rect x="-2" y="-28" width="4" height="10" rx="2" fill="#FFFFFF" opacity="0.5" />
      </g>

      <!-- Center Pivot Hub -->
      <circle cx="0" cy="0" r="14" fill="#0A0A0A" />
      <circle cx="0" cy="0" r="14" fill="none" stroke="#222222" stroke-width="2" />
      <circle cx="0" cy="0" r="6" fill="#1A1A1A" />
    </g>

    <!-- ========================================== -->
    <!-- 3. TACTILE ADJUSTMENT SLIDERS (Preferences)-->
    <!-- ========================================== -->
    <g id="slider-panel" transform="translate(0, 0)">

      <!-- Track 1 (Left Slider) -->
      <rect x="290" y="170" width="16" height="180" rx="8" fill="#0A0A0A" />
      <rect x="290" y="170" width="16" height="180" rx="8" fill="none" stroke="#000000" stroke-width="4" opacity="0.8" filter="url(#blur-small)" />
      <!-- Yellow active fill in track -->
      <rect x="294" y="240" width="8" height="106" rx="4" fill="#FACC15" opacity="0.3" />

      <!-- Track 2 (Right Slider) -->
      <rect x="350" y="170" width="16" height="180" rx="8" fill="#0A0A0A" />
      <rect x="350" y="170" width="16" height="180" rx="8" fill="none" stroke="#000000" stroke-width="4" opacity="0.8" filter="url(#blur-small)" />
      <!-- Yellow active fill in track -->
      <rect x="354" y="300" width="8" height="46" rx="4" fill="#FACC15" opacity="0.3" />

      <!-- Knob 1 (Vibrant Yellow - Set High) -->
      <g transform="translate(298, 230)">
        <!-- Knob Shadow -->
        <rect x="-26" y="-16" width="52" height="32" rx="10" fill="#000000" opacity="0.6" filter="url(#blur-medium)" transform="translate(0, 8)" />
        <!-- Knob Extrusion -->
        <rect x="-26" y="-16" width="52" height="32" rx="10" fill="url(#yellowExt)" transform="translate(0, 4)" />
        <!-- Knob Face -->
        <rect x="-26" y="-16" width="52" height="32" rx="10" fill="url(#yellowBadge)" />
        <!-- Highlights & Grip Lines -->
        <rect x="-24" y="-14" width="48" height="28" rx="8" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.5" />
        <path d="M -8 -8 L -8 8 M 0 -8 L 0 8 M 8 -8 L 8 8" fill="none" stroke="#A17E00" stroke-width="3" stroke-linecap="round" />
        <path d="M -8 -8 L -8 8 M 0 -8 L 0 8 M 8 -8 L 8 8" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.4" transform="translate(-1, -1)" />
      </g>

      <!-- Knob 2 (Matte Black - Set Low) -->
      <g transform="translate(358, 290)">
        <!-- Knob Shadow -->
        <rect x="-26" y="-16" width="52" height="32" rx="10" fill="#000000" opacity="0.6" filter="url(#blur-medium)" transform="translate(0, 8)" />
        <!-- Knob Extrusion -->
        <rect x="-26" y="-16" width="52" height="32" rx="10" fill="#050505" transform="translate(0, 4)" />
        <!-- Knob Face -->
        <rect x="-26" y="-16" width="52" height="32" rx="10" fill="url(#matteBlack)" />
        <!-- Highlights & Grip Lines -->
        <rect x="-24" y="-14" width="48" height="28" rx="8" fill="none" stroke="url(#edgeHighlight)" stroke-width="2" />
        <path d="M -8 -8 L -8 8 M 0 -8 L 0 8 M 8 -8 L 8 8" fill="none" stroke="#222222" stroke-width="3" stroke-linecap="round" />

        <!-- Subtle Active Indicator Dot -->
        <circle cx="16" cy="0" r="3" fill="#FACC15" />
      </g>
    </g>

    <!-- ========================================== -->
    <!-- 4. FLOATING TOGGLE SWITCH (System Setting) -->
    <!-- ========================================== -->
    <!-- Represents an "On/Off" or "Enable" feature, floating above -->
    <g id="toggle-switch" transform="translate(360, 100) rotate(15)">
      <!-- Toggle Drop Shadow -->
      <rect x="-44" y="-24" width="88" height="48" rx="24" fill="#000000" opacity="0.6" filter="url(#blur-medium)" transform="translate(0, 16)" />

      <!-- Base Outer Pill Extrusion -->
      <rect x="-44" y="-24" width="88" height="48" rx="24" fill="#050505" transform="translate(0, 8)" />
      <rect x="-44" y="-24" width="88" height="48" rx="24" fill="#0A0A0A" transform="translate(0, 4)" />

      <!-- Base Outer Pill Face -->
      <rect x="-44" y="-24" width="88" height="48" rx="24" fill="url(#matteBlackDark)" />
      <rect x="-43" y="-23" width="86" height="46" rx="23" fill="none" stroke="url(#edgeHighlight)" stroke-width="2" />

      <!-- Inner Track Cavity -->
      <rect x="-34" y="-14" width="68" height="28" rx="14" fill="#050505" />
      <rect x="-34" y="-14" width="68" height="28" rx="14" fill="none" stroke="#000000" stroke-width="4" opacity="0.8" filter="url(#blur-small)" />

      <!-- Yellow "On" Active Background -->
      <rect x="-34" y="-14" width="50" height="28" rx="14" fill="#FACC15" opacity="0.25" />

      <!-- Circular Active Switch Knob (Pushed Right) -->
      <g transform="translate(16, 0)">
        <!-- Knob Shadow in Track -->
        <circle cx="0" cy="0" r="16" fill="#000000" opacity="0.8" filter="url(#blur-small)" transform="translate(-2, 4)" />

        <!-- Knob Extrusion -->
        <circle cx="0" cy="0" r="16" fill="url(#yellowExt)" transform="translate(0, 2)" />

        <!-- Knob Face -->
        <circle cx="0" cy="0" r="16" fill="url(#yellowBadge)" />

        <!-- Knob Highlights -->
        <circle cx="0" cy="0" r="14" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.5" />
        <circle cx="-4" cy="-4" r="4" fill="#FFFFFF" opacity="0.3" filter="url(#blur-small)" />
      </g>
    </g>

    <!-- ========================================== -->
    <!-- 5. FLOATING AMBIENT PARTICLES / SPARKS     -->
    <!-- ========================================== -->

    <!-- Top Left Sparkle -->
    <g transform="translate(80, 110) scale(0.8)">
      <path d="M 0 -16 C 0 -4, 4 0, 16 0 C 4 0, 0 4, 0 16 C 0 4, -4 0, -16 0 C -4 0, 0 -4, 0 -16 Z" fill="#FACC15" filter="url(#blur-small)" opacity="0.8" />
      <path d="M 0 -12 C 0 -3, 3 0, 12 0 C 3 0, 0 3, 0 12 C 0 3, -3 0, -12 0 C -3 0, 0 -3, 0 -12 Z" fill="#FFF080" />
    </g>

    <!-- Bottom Left Orb -->
    <g transform="translate(40, 320)">
      <circle cx="0" cy="12" r="10" fill="#000000" opacity="0.4" filter="url(#blur-small)" />
      <circle cx="0" cy="0" r="10" fill="url(#yellowBadge)" />
      <circle cx="-2" cy="-2" r="4" fill="#FFFFFF" opacity="0.6" filter="url(#blur-small)" />
    </g>

    <!-- Tiny Glowing Dot near the Sliders -->
    <circle cx="430" cy="280" r="5" fill="#FACC15" filter="url(#blur-small)" opacity="0.8" />
    <circle cx="430" cy="280" r="3" fill="#FFF080" />

  </g>
</svg>